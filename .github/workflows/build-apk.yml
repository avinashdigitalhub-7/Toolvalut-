name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir project
          unzip -q toolvault-app.zip -d project

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: project
        run: npm install

      - name: Build web app
        working-directory: project
        run: npm run build

      - name: Add Android platform
        working-directory: project
        run: npx cap add android

      - name: Generate icons and splash
        working-directory: project
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Sync web build into Android
        working-directory: project
        run: npx cap sync android

      - name: Use targetSdk 34
        working-directory: project
        run: sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/' android/variables.gradle

      - name: Build debug APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToolVault-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
